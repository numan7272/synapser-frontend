name: synapser_frontend
description: "Ein intelligenter Tagesplaner im nativen Cupertino Design."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI Icons
  cupertino_icons: ^1.0.6
  
  # Das gewünschte native Paket
  cupertino_native: ^0.1.1

  # Backend Kommunikation
  http: ^1.2.0
  
  # Hilfsmittel
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  modal_bottom_sheet: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true