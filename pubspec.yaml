name: synapser_frontend
description: "Synapser - KI-gestützter Kalenderplaner und Lebenspilot"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.4.0
  provider: ^6.1.1
  google_fonts: ^6.1.0
  flutter_secure_storage: ^9.0.0
  image_picker: ^1.0.7
  intl: ^0.19.0
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
